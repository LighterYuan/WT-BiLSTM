project:
  name: WT-TBiLSTM_Major_Revision_Addon
  random_seed: 42

paths:
  raw_data_dir: data/raw
  processed_dir: data/processed_major_revision
  wavelet_dir: data/wavelet_major_revision
  metrics_dir: results_major_revision/metrics
  predictions_dir: results_major_revision/predictions
  figures_dir: results_major_revision/figures
  tables_dir: results_major_revision/tables
  model_dir: models_major_revision
  log_dir: logs_major_revision

datasets:
  UK_Ac:
    file: UK_Ac.csv
    time_col: Time
    target_col: traffic
    train_ratio: 0.80
  EU_Co:
    file: EU_Co.csv
    time_col: Time
    target_col: traffic
    train_ratio: 0.80

preprocessing:
  time_steps: 10
  scaler: minmax
  leakage_safe: true

wavelet:
  enabled_models:
    - WT-LSTM
    - WT-BiLSTM
    - WT-TBiLSTM
  wavelet: db8
  level: 3
  threshold_mode: soft
  threshold_strategy: universal
  threshold_scale: 1.0

model:
  units: 64
  dense_units: 32
  dropout: 0.20
  conv_filters: 32
  conv_kernel_size: 3
  attention_units: 32
  tcn_filters: 64
  tcn_kernel_size: 3
  transformer_d_model: 64
  transformer_heads: 4
  transformer_ff_dim: 128
  transformer_blocks: 2
  patch_len: 4
  patch_stride: 2

training:
  epochs: 80
  batch_size: 64
  validation_split: 0.10
  learning_rate: 0.001
  patience: 12
  reduce_lr_patience: 6
  min_delta: 0.000001
  save_model: true

quick:
  max_rows: 1800
  epochs: 3
  batch_size: 32
  models:
    - TCN
    - Transformer

experiments:
  models:
    - TCN
    - Transformer
    - DLinear
    - NLinear
    - PatchTST
  default_seeds:
    - 1
    - 2
    - 3
    - 4
    - 5

major_revision:
  baseline_models:
    - TCN
    - Transformer
    - DLinear
    - NLinear
    - PatchTST
  sensitivity_model: WT-BiLSTM
  sensitivity_seeds:
    - 1
    - 2
    - 3
  window_lengths:
    - 5
    - 8
    - 10
    - 12
    - 15
    - 20
  wavelet_bases:
    - haar
    - db2
    - db4
    - db6
    - db8
    - sym4
    - coif3
  decomposition_levels:
    - 1
    - 2
    - 3
    - 4
    - 5
  threshold_modes:
    - soft
    - hard
    - garrote
  threshold_strategies:
    - universal
    - minimax
    - sure
    - bayes
  threshold_scales:
    - 0.5
    - 1.0
    - 1.5
    - 2.0

robustness:
  segment_size: 500

statistics:
  alpha: 0.05
  reference_model: WT-BiLSTM
  tests:
    - TCN
    - Transformer
    - PatchTST
